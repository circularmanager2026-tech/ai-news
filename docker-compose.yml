services:
  nginx:
    image: nginx:alpine
    container_name: ai-news-nginx
    networks:
      - ai-news-network
      - traefik-public
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # Router HTTP
      - "traefik.http.routers.ai-news.rule=Host(`ai.dev.interwwweb.com`)"
      - "traefik.http.routers.ai-news.entrypoints=web"
      # Router HTTPS
      - "traefik.http.routers.ai-news-secure.rule=Host(`ai.dev.interwwweb.com`)"
      - "traefik.http.routers.ai-news-secure.entrypoints=websecure"
      - "traefik.http.routers.ai-news-secure.tls=true"
      - "traefik.http.routers.ai-news-secure.tls.certresolver=letsencrypt"
      # Servicio
      - "traefik.http.services.ai-news.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  ai-news-network:
    driver: bridge
  traefik-public:
    external: true